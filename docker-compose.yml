# Local development database. Production databases are provisioned separately.
# Usage: cp .env.example .env && docker compose up -d
name: inthiseconomy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ite_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-inthiseconomy}
    ports:
      # Bound to localhost only. Defaults to 5433 to avoid clashing with a locally installed PostgreSQL.
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
